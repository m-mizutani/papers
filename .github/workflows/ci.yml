name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git diff -- go.mod go.sum
            # the tidy files, for copying from the log
            for f in go.mod go.sum; do
              echo "----- BEGIN $f -----"; cat "$f"; echo "----- END $f -----"
            done
            echo "::error::go.mod or go.sum is not tidy; run go mod tidy"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  firestore:
    name: Go (repository contract tests on the Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 28615:28615 \
            google/cloud-sdk:emulators gcloud emulators firestore start --host-port=0.0.0.0:28615
          for i in $(seq 1 120); do
            curl -s http://127.0.0.1:28615/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the emulator did not start" >&2
          docker logs firestore
          exit 1
      - name: Contract tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:28615
          TEST_FIRESTORE_PROJECT_ID: papers-test
        run: go test ./pkg/repository/... -count=1

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the UI and the server
        run: |
          (cd frontend && pnpm build)
          go build -o papers .
      - name: Run
        working-directory: frontend
        env:
          PAPERS_BIN: ../papers
        run: pnpm test:e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
