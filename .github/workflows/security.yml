name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # new advisories appear without code changes
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # the latest patch release, as the server is built with
          go-version: "1.26.x"
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -quiet -exclude-generated -exclude-dir=frontend ./...

  trivy:
    name: trivy (dependencies and secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan go.mod, pnpm-lock.yaml and the tree for secrets
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs frontend/node_modules .

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - run: pnpm audit --prod --audit-level high
